name: Auto Post to X

# 課金対策 (2026-09-16): 以前は投稿前に runner 上で最大 90〜180 分 sleep していて、
# その待ち時間が GitHub Actions の従量 (私的リポは月 2,000 分の無料枠) を食い潰していた
# (1 run 12 分〜2 時間、月 900 分前後)。ランダム性は「30 分刻みの候補時刻を 3 つ登録し、
# 日付から決まる 1 つだけ実際に投稿する」方式で保ち、待ち時間をゼロにする。
# 候補時刻に当たらない run は checkout もせず数秒で終わる。
on:
  schedule:
    - cron: '0 1 * * 1,2,3,4,5'         # 10:00 JST (seo 候補 1・月火水木金)
    - cron: '30 1 * * 1,2,3,4,5'        # 10:30 JST (seo 候補 2)
    - cron: '0 2 * * 1,2,3,4,5'         # 11:00 JST (seo 候補 3)
    - cron: '30 10 * * 3,6'   # 19:30 JST (note 候補 1・水土)
    - cron: '30 11 * * 3,6'   # 20:30 JST (note 候補 2)
    - cron: '30 12 * * 3,6'   # 21:30 JST (note 候補 3)
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post type (note / seo)'
        required: false
        default: 'note'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pick today's slot (no sleep on the paid runner)
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 1 * * 1,2,3,4,5")        TYPE=seo;  SLOT=0 ;;
            "30 1 * * 1,2,3,4,5")       TYPE=seo;  SLOT=1 ;;
            "0 2 * * 1,2,3,4,5")        TYPE=seo;  SLOT=2 ;;
            "30 10 * * 3,6")  TYPE=note; SLOT=0 ;;
            "30 11 * * 3,6")  TYPE=note; SLOT=1 ;;
            "30 12 * * 3,6")  TYPE=note; SLOT=2 ;;
            *)                  TYPE="${{ github.event.inputs.post_type }}"; SLOT=-1 ;;
          esac
          if [ "$SLOT" -ge 0 ]; then
            DAY=$(TZ=Asia/Tokyo date +%Y%m%d)
            OFFSET=0; [ "$TYPE" = note ] && OFFSET=3
            CHOSEN=$(( (DAY * 7 + OFFSET) % 3 ))
            if [ "$SLOT" -ne "$CHOSEN" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "not today's slot (slot=$SLOT chosen=$CHOSEN type=$TYPE)"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "POST_TYPE=${TYPE:-note}" >> "$GITHUB_ENV"
          echo "posting: type=${TYPE:-note} slot=$SLOT"

      - uses: actions/checkout@v4
        if: steps.slot.outputs.run == 'true'

      - name: Set up Python
        if: steps.slot.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.slot.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Post to X
        if: steps.slot.outputs.run == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python post.py

      - name: Commit posted log
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f posted_urls.json posted_tweets.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update post logs [skip ci]"
          git pull --rebase origin main || {
            git rebase --abort || true
            echo "Rebase conflict. Aborting."
            exit 1
          }
          git push origin HEAD:main
